apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aerolink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/savindufernando/enterprise-cloud-2-api_gateway:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: aerolink-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aerolink
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
