[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passenger-service"
version = "1.0.0"
description = "AeroLink Passenger Identity and Profiling Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Passlib and JWT are provided by shared module, but let's be explicit if we run standalone
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
