[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-service"
version = "1.0.0"
description = "AeroLink Flight Management Service"
requires-python = ">=3.12"
dependencies = [
    # Reference the local shared library in a real monorepo we'd use path references
    # For this docker compose setup, we will pip install -e ../shared in the Dockerfile
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
